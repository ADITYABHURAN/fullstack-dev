name: auth-workflow.yml

on:
  push:
    branches:
      - 'main'
    paths:
      - '**.js'

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MONGODB_URL: mongodb://127.0.0.1:27017/testdb
      JWT_ACCESS_SECRET: test_secret_key
      JWT_REFRESH_SECRET: test_refresh_secret
      NODE_ENV: test
      PORT: 8000

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js 24
        uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Fix Jest permissions
        run: chmod +x node_modules/.bin/jest

      - name: Start app
        run: npm start &

      - name: Run tests
        run: npm test
